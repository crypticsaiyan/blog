<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Referrer-Policy" content="no-referrer, strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' https://fonts.googleapis.com;
    img-src 'self' https://images.unsplash.com https://i.imgur.com;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self';
    media-src 'self';
    object-src 'none';
    child-src 'self';
    form-action 'none';
    base-uri 'self';
  ">

  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  {%- seo title=false -%}
  {%- feed_meta -%}

  {% if page.robots %}
    <meta name="robots" content="{{page.robots}}" />
  {% endif %}

  <!-- insert favicons, used https://realfavicongenerator.net/ -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}" />
  <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}" />
  <link rel="manifest" href="{{ '/assets/favicon/site.webmanifest' | relative_url }}" />

  <!-- fonts as <link>, not @import inside the CSS, so they download in
       parallel with the stylesheet instead of after it -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" />

  {%- assign style_light_css = site.style_light | append: '.css' -%}
  {%- assign style_dark_css = site.style_dark | append: '.css' -%}

  {%- if site.style_light == site.style_dark -%}
    <link rel="stylesheet" type="text/css" href="{{ "/assets/css/" | append: style_light_css | relative_url }}">
  {%- else -%}
    <link rel="stylesheet" type="text/css" href="{{ "/assets/css/" | append: style_light_css | relative_url }}" media="screen and (prefers-color-scheme: light)">
    <link rel="stylesheet" type="text/css" href="{{ "/assets/css/" | append: style_dark_css | relative_url }}" media="screen and (prefers-color-scheme: dark)">
  {%- endif -%}

</head>
