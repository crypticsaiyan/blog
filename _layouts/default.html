<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<meta http-equiv="Referrer-Policy" content="no-referrer, strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://cdn.jsdelivr.net;
  style-src 'self' https://fonts.googleapis.com;
  img-src 'self' https://images.unsplash.com https://i.imgur.com;
  font-src 'self' https://fonts.gstatic.com;
  connect-src 'self';
  media-src 'self';
  object-src 'none';
  child-src 'self';
  form-action 'none';
  base-uri 'self';
">

  {%- include head.html -%}

  <body>
    <div class="noisecont" aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"></div>
    <div class="scroll-indicator" aria-hidden="true">
      <span class="key" data-dir="up">&#8593;</span>
      <span class="key" data-dir="up">k</span>
      <span class="key" data-dir="down">j</span>
      <span class="key" data-dir="down">&#8595;</span>
    </div>
    <div class="container">

      {%- include header.html -%}

    <main>
      {{ content }}
    </main>

    {%- include footer.html -%}

    </div>
    <script src="{{ '/assets/js/cursor.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/copy-code.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/scroll-nav.js' | relative_url }}" defer></script>
  </body>
</html>
